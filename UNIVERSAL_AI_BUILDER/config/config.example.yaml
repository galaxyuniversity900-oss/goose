# Copy into Goose config only after review. Configure providers with: goose configure
# Never store API keys or GitHub tokens in this file.
GOOSE_MODE: approve
GOOSE_TEMPERATURE: 0.2
GOOSE_MAX_TURNS: 100
GOOSE_CLI_SHOW_COST: true
GOOSE_TELEMETRY_ENABLED: false
SECURITY_PROMPT_ENABLED: true
extensions:
  developer:
    type: builtin
    name: developer
    enabled: true
    bundled: true
    timeout: 300
  memory:
    type: builtin
    name: memory
    enabled: true
    bundled: true
    timeout: 300
